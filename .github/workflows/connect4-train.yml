name: Connect 4 nightly training

on:
  schedule:
    - cron: "17 3 * * *"   # every night at 03:17 UTC
  workflow_dispatch:
    inputs:
      selfplay:
        description: "Self-play games to add (0 = learn only from real games)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: connect4-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install NumPy and CPU-only PyTorch
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile the perfect solver that labels positions
        run: gcc -O3 -o tools/solver tools/solver.c

      - name: Get the latest model from the connect4-model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download connect4-model -p checkpoint.pt -p model.npz -D data --clobber \
            || echo "no release yet: starting from the committed v1 model"

      - name: Label new positions, retrain and gate on the test set
        run: |
          wc -l < data/pending.txt > "$RUNNER_TEMP/consumed" 2>/dev/null || echo 0 > "$RUNNER_TEMP/consumed"
          python -m connect4.train --selfplay "${{ github.event.inputs.selfplay || '0' }}" --time-budget 9000

      - name: Publish the model if it was accepted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACCEPTED=$(python -c "import json; print(json.load(open('data/metrics.json'))['runs'][-1]['accepted'])")
          VERSION=$(python -c "import json; print(json.load(open('data/metrics.json'))['version'])")
          if [ "$ACCEPTED" = "True" ]; then
            gh release view connect4-model >/dev/null 2>&1 || \
              gh release create connect4-model --title "Connect 4 bot model" \
                --notes "Latest weights of the Connect 4 bot on my profile, updated by the nightly training workflow."
            gh release upload connect4-model data/checkpoint.pt data/model.npz --clobber
            gh release edit connect4-model --notes "Model v$VERSION, trained $(date -u +%F). Updated nightly by the training workflow."
          fi

      - name: Commit the grown train set, metrics and chart
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "connect4-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          cp data/train.txt data/metrics.json "$RUNNER_TEMP/out/"
          CONSUMED=$(cat "$RUNNER_TEMP/consumed")
          for attempt in 1 2 3; do
            # visitors may have played while we trained: rebuild on top of the latest repo state
            git fetch origin "$BRANCH" && git reset --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/out/train.txt" "$RUNNER_TEMP/out/metrics.json" data/
            # drop only the queued positions we labelled; keep anything queued during training
            touch data/pending.txt && tail -n +$((CONSUMED + 1)) data/pending.txt > "$RUNNER_TEMP/pending" && mv "$RUNNER_TEMP/pending" data/pending.txt
            python -m connect4.render
            git add data/train.txt data/metrics.json data/pending.txt README.md assets/c4_progress.svg assets/c4_mind.svg
            git commit -m "connect4: nightly training run" || { echo "nothing to commit"; break; }
            if git push origin "HEAD:$BRANCH"; then break; fi
            sleep $((attempt * 5))
          done
