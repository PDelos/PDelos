<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
.bg{fill:#ffffff} .title{fill:#1f2328;font-size:15px;font-weight:600} .lbl{fill:#59636e;font-size:11px}
.txt{fill:#1f2328;font-size:12px} .big{fill:#1f2328;font-size:13px;font-weight:600}
.you{fill:#cf222e} .bot{fill:#d4a72c} .track{fill:#eaeef2} .grid{stroke:#d1d9e0;stroke-width:1}
.vis{fill:#d4a72c} .vis.pick{fill:#bf8700} .pol{stroke:#1f2328;stroke-width:2;stroke-dasharray:4 3}
.pickbox{fill:none;stroke:#bf8700;stroke-width:1.5;stroke-dasharray:3 3} .mid{stroke:#1f2328;stroke-width:1.5}
@media (prefers-color-scheme: dark) {
 .bg{fill:#0d1117} .title,.txt,.big{fill:#f0f6fc} .lbl{fill:#9198a1} .track{fill:#21262d} .grid{stroke:#3d444d}
 .you{fill:#ff7b72} .bot,.vis{fill:#e3b341} .vis.pick{fill:#f2cc60} .pol,.mid{stroke:#f0f6fc} .pickbox{stroke:#f2cc60}
}
</style>
<rect width="760" height="300" rx="10" class="bg"/>
<text x="24" y="30" class="title">Before anyone has played: on an empty board the bot would open in column 4</text>
<text x="24" y="46" class="lbl">EVALUATION · expected result if both sides play like the bot from here</text>
<rect x="24" y="52" width="712" height="22" rx="5" class="track"/><rect x="24" y="52" width="316.4" height="22" rx="5" class="you"/><rect x="340.4" y="52" width="395.6" height="22" rx="5" class="bot"/><line x1="380.0" x2="380.0" y1="49" y2="77" class="mid"/>
<circle cx="30" cy="88" r="6" class="you"/><text x="42" y="92" class="big">you 44%</text><circle cx="730" cy="88" r="6" class="bot"/><text x="718" y="92" text-anchor="end" class="big">bot 56%</text>
<text x="24" y="122" class="lbl">DECISION · bars: share of the search spent on each column · dashes: the network's instinct before searching</text>
<line x1="24" x2="736" y1="262" y2="262" class="grid"/>
