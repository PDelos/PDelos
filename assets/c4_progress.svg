<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
.bg{fill:#ffffff} .title{fill:#1f2328;font-size:15px;font-weight:600} .lbl{fill:#59636e;font-size:11px}
